<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#041e42">
<title>Plano CFO PMGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidade PMGO: azul-marinho (Pantone 282C) e amarelo-ouro, com a faixa verde e amarela de Goiás sob o cabeçalho */
  --bg:#eef1f6; --surface:#ffffff; --ink:#0f1b2d; --muted:#55627a; --line:#d8dee8;
  --accent:#041e42; --accent-soft:#e1e7f1; --gold:#b8901c;
  --navy:#041e42; --navy2:#0b2d5c; --ouro:#c9a227; --gverde:#0a7a3e; --gamarelo:#f2c300;
  --ok:#2e7d4f; --warn:#b26a00; --bad:#b3261e; --bad-soft:#fbe9e7; --warn-soft:#fff3df;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07111f; --surface:#0e1c30; --ink:#e8edf5; --muted:#9aa7bd; --line:#1f3150;
    --accent:#e0b84a; --accent-soft:#1a2b45; --gold:#e0b84a;
    --ok:#7fcf9c; --warn:#f0b14e; --bad:#f2877d; --bad-soft:#3a1d1a; --warn-soft:#3a2c12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07111f; --surface:#0e1c30; --ink:#e8edf5; --muted:#9aa7bd; --line:#1f3150;
  --accent:#e0b84a; --accent-soft:#1a2b45; --gold:#e0b84a;
  --ok:#7fcf9c; --warn:#f0b14e; --bad:#f2877d; --bad-soft:#3a1d1a; --warn-soft:#3a2c12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header.top{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:14px 16px 12px;border-bottom:3px solid var(--ouro)}
.stripe{height:6px;background:repeating-linear-gradient(180deg,var(--gverde) 0 1.5px,var(--gamarelo) 1.5px 3px)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:52px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.top h1 small{display:block;font:600 12px/1.2 var(--body);letter-spacing:.14em;color:var(--ouro);text-transform:uppercase}
.top h1{font:700 22px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.top .sub{font-size:13px;opacity:.85;margin-top:2px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ouro)}
.card .bar{background:var(--line);margin-top:6px}
.card input+input,.card input+.row,.card textarea{margin-top:8px}
.top .stats{display:flex;gap:16px;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:16px;padding-bottom:96px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h2{font:700 19px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:flex-start}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .txt{flex:1;min-width:0}
.code{font:600 13px var(--display);letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.tt{font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.pill.red{background:var(--bad-soft);color:var(--bad)}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--surface);padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font:600 13px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
input[type=search],input[type=date],input[type=number],input[type=url],input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 10px}
details.mat{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.mat>summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details.mat>summary::-webkit-details-marker{display:none}
details.mat .list{padding:0 14px 6px}
.topic{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.topic .tt{flex:1}
.topic.nd .tt{color:var(--bad);font-weight:600}
.week{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.week:first-of-type{border-top:0}
.week.now{background:var(--accent-soft);margin:0 -14px;padding:12px 14px}
.week input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.wk{font:700 16px var(--display);color:var(--accent);min-width:34px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.dlg.open{display:flex}
details>input,details>button{margin-top:8px}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.revrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px}
.switch input{width:22px;height:22px;accent-color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:15px}
.kv b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.empty{padding:8px 0;color:var(--muted)}
a{color:var(--accent);font-weight:600}
a.btn{text-decoration:none;display:inline-block}
.clock{font:700 44px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--accent)}
.bar2{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}.bar2>i{display:block;height:100%;background:var(--gold)}
.hrow{display:grid;grid-template-columns:84px 1fr 52px;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.hrow.now .hd{color:var(--accent);font-weight:600}.hb{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}.hb>i{display:block;height:100%;background:var(--accent)}.hv{text-align:right;font-size:14px}
.pjl{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
.pjrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.pjlinks{display:flex;gap:10px;white-space:nowrap}
nav.tabs button{font-size:11px;padding-left:2px;padding-right:2px}
</style>
</head>

const I_ID=0,I_MAT=1,I_AULA=2,I_TIT=3,I_BL=4,I_ED=5,I_OBS=6,I_CUR=7;

/* ---------- estado ---------- */
const KEY = "planoCFO.v2";
let S = {t:{}, w:{}};
let mem = true;
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); localStorage.setItem(KEY+".probe","1"); mem = false; } catch(e){ mem = true; }
S.t = S.t || {}; S.w = S.w || {}; S.tm = S.tm || {run:null, days:{}};

function save(){ S.u = Date.now(); keep(); syncSoon(); }

/* ---------- sincronização (Google Apps Script) ---------- */
const SYNC_URL = "https://script.google.com/macros/s/AKfycbzuDgI8GnDJx0n_sX8FIx3QiAbfsIBmLqwCGFSvxJmEz2WbqsT8eQtsmOnXN4HD84_NwA/exec";
const SKEY = KEY + ".conta";
try { if (/cfg=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search); } catch(e){}
function syncCfg(){ let c = null; try { c = JSON.parse(localStorage.getItem(SKEY)||"null"); } catch(e){} return (c && c.t) ? {url:SYNC_URL, t:c.t, u:c.u} : null; }
function setConta(c){ try { if (c) localStorage.setItem(SKEY, JSON.stringify(c)); else localStorage.removeItem(SKEY); } catch(e){} }
async function api(body){ const r = await fetch(SYNC_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body), redirect:"follow"}); return r.json(); }
async function entrar(acao, u, senha){
  if (!navigator.onLine){ toast("Sem internet"); return; }
  const btns = document.querySelectorAll("#lgIn,#lgNew"); btns.forEach(b => b.disabled = true);
  try {
    const r = await api({acao, u, senha});
    if (!r.ok){ toast(r.erro || "Não foi possível entrar"); return; }
    setConta({t:r.t, u:r.u}); S.sy = 0; GR = null; keep();
    toast(acao === "criar" ? "Conta criada. Bem-vindo, " + r.u : "Entrou como " + r.u);
    await syncNow(false); render();
  } catch(e){ toast("Falha de conexão. Tente de novo"); }
  finally { btns.forEach(b => { if (b.isConnected) b.disabled = false; }); }
}
async function sair(){ const c = syncCfg(); setConta(null); S.sy = 0; GR = null; keep(); render(); toast("Você saiu da conta. O progresso continua neste aparelho"); try { if (c) await api({acao:"sair", t:c.t}); } catch(e){} }
let syncSt = {last:0, err:"", busy:false}, syncT = null, syncAgain = false;
function syncSoon(){ if (!syncCfg()) return; clearTimeout(syncT); syncT = setTimeout(() => syncNow(true), 1500); }
function norm(o){ o = o || {}; o.t = o.t||{}; o.w = o.w||{}; o.tm = o.tm||{run:null,days:{}}; o.tm.days = o.tm.days||{}; return o; }
function hasData(o){ return o && (Object.keys(o.t||{}).length || Object.keys((o.tm||{}).days||{}).length || Object.values(o.w||{}).some(Boolean)); }
function mergeFirst(local, remote){
  const m = norm(JSON.parse(JSON.stringify(remote)));
  for (const id in local.t) if (!m.t[id] || !m.t[id].f) m.t[id] = local.t[id];
  for (const d in local.tm.days) m.tm.days[d] = Math.max(m.tm.days[d]||0, local.tm.days[d]);
  for (const w in local.w) if (local.w[w]) m.w[w] = true;
  if (!m.tm.run && local.tm.run) m.tm.run = local.tm.run;
  return m;
}
function adopt(r){
  const cur = JSON.stringify(S); S = norm(r); S.sy = 1; keep();
  if (JSON.stringify(S) !== cur) { const dl = document.getElementById("dlg"); if (!dl || !dl.classList.contains("open")) render(); }
}
async function syncNow(pushOnly){
  const c = syncCfg(); if (!c) return;
  if (syncSt.busy){ syncAgain = true; return; }
  if (!navigator.onLine){ syncSt.err = "sem internet"; paintSync(); return; }
  syncSt.busy = true; paintSync();
  try {
    if (!pushOnly || !S.sy){
      const g = await (await fetch(c.url + "?t=" + encodeURIComponent(c.t) + "&_=" + Date.now(), {redirect:"follow"})).json();
      if (!g.ok) throw new Error(g.erro||"erro");
      const r = g.s;
      if (!S.sy){
        try { if (hasData(S)) localStorage.setItem(KEY+".antes-sync", JSON.stringify(S)); } catch(e){}
        if (r && hasData(r)) { const m = mergeFirst(norm(S), r); m.u = Date.now(); S = m; }
        S.sy = 1; S.u = S.u || Date.now(); keep(); render();
      } else if (r && (r.u||0) > (S.u||0)) { adopt(r); syncSt.last = Date.now(); syncSt.err = ""; return; }
      else if (r && (r.u||0) === (S.u||0)) { syncSt.last = Date.now(); syncSt.err = ""; return; }
    }
    const p = await (await fetch(c.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({t:c.t, s:S}), redirect:"follow", keepalive: JSON.stringify(S).length < 60000})).json();
    if (!p.ok) throw new Error(p.erro||"erro");
    if (p.antigo && p.s) adopt(p.s);
    syncSt.last = Date.now(); syncSt.err = "";
  } catch(e){ if (e && e.message === "sessao"){ setConta(null); syncSt.err = ""; toast("Sessão expirada: entre de novo"); render(); } else syncSt.err = "falhou, tento de novo"; }
  finally { syncSt.busy = false; paintSync(); if (syncAgain){ syncAgain = false; syncSoon(); } }
}
function syncTxt(){
  if (!syncCfg()) return "Desligada: entre na sua conta";
  if (syncSt.busy) return "Sincronizando…";
  if (syncSt.err) return "Sem sincronizar (" + syncSt.err + ")";
  if (syncSt.last){ const d = new Date(syncSt.last); return "Sincronizado às " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
  return "Aguardando";
}
function paintSync(){ const e = document.getElementById("syncSt"); if (e) e.textContent = syncTxt(); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(false); else if (syncT){ clearTimeout(syncT); syncNow(true); } });
window.addEventListener("online", () => syncNow(false));
setInterval(() => { if (document.visibilityState === "visible") syncNow(false); }, 60000);

  return EC + CURSO[x[I_CUR] || x[I_MAT]] + "/aulas";
}

/* ---------- datas ---------- */
function parse(d){ const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd); }
function iso(dt){ const p = n => String(n).padStart(2,"0"); return dt.getFullYear()+"-"+p(dt.getMonth()+1)+"-"+p(dt.getDate()); }
function add(d,n){ const x = parse(d); x.setDate(x.getDate()+n); return iso(x); }
function today(){ return iso(new Date()); }
function br(d){ const x = parse(d); return String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0"); }
const WD = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

/* revisões do método: 48h = 1ª vez + 2 dias; 7 dias = 48h + 7; 30 dias = 7d + 30 */
function revs(id){
  const s = S.t[id]; if (!s || !s.f) return null;
  const r48 = add(s.f,2), r7 = add(r48,7), r30 = add(r7,30);
  return [{k:"d48",n:"48h",tipo:"caderno de questões",d:r48,ok:!!s.d48},{k:"d7",n:"7 dias",tipo:"caderno de erros",d:r7,ok:!!s.d7},{k:"d30",n:"30 dias",tipo:"caderno de erros",d:r30,ok:!!s.d30}];
}
function nextRev(id){ const r = revs(id); if (!r) return null; return r.find(x => !x.ok) || null; }
function status(id){
  const s = S.t[id]; if (!s || !s.f) return {cls:"", txt:"não estudada"};
  const n = nextRev(id), t = today();
  if (!n) return {cls:"done", txt:"revisões ok"};
  if (n.d < t) return {cls:"late", txt:"rev "+n.n+" atrasada"};
  if (n.d === t) return {cls:"due", txt:"rev "+n.n+" hoje"};
  return {cls:"", txt:"rev "+n.n+" "+br(n.d)};
}
function currentBlock(){
  for (const b of ["I","II","III"]) if (T.some(x => x[I_BL]===b && !(S.t[x[I_ID]]||{}).f)) return b;
  return null;
}
function nextOf(mat, block){ return T.find(x => x[I_MAT]===mat && x[I_BL]===block && !(S.t[x[I_ID]]||{}).f); }

/* ---------- cabeçalho ---------- */
function header(){
  const seen = T.filter(x => (S.t[x[I_ID]]||{}).f).length;
  let done = 0; for (const c in S.t){ const s=S.t[c]; done += (s.d48?1:0)+(s.d7?1:0)+(s.d30?1:0); }
  document.getElementById("progBar").style.width = (seen/T.length*100).toFixed(1)+"%";
  document.getElementById("stSeen").textContent = seen+" de "+T.length+" aulas estudadas";
  document.getElementById("stRev").textContent = done+" revisões feitas";
}

/* ---------- cronômetro de horas líquidas ---------- */
const META_DIA = 4*3600, META_SEM = 20*3600;
function tmDay(d){ let v = S.tm.days[d] || 0; if (S.tm.run && d===today()) v += Math.max(0,(Date.now()-S.tm.run)/1000); return v; }
function tmStart(){ if (!S.tm.run){ S.tm.run = Date.now(); save(); } }
function tmStop(){ if (S.tm.run){ const d = today(); S.tm.days[d] = (S.tm.days[d]||0) + Math.max(0,(Date.now()-S.tm.run)/1000); S.tm.run = null; save(); } }
function tmAdd(d, sec){ S.tm.days[d] = Math.max(0,(S.tm.days[d]||0) + sec); save(); }
function weekStart(d){ const x = parse(d); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return iso(x); }
function tmWeek(){ const ws = weekStart(today()); let s = 0; for (let i=0;i<7;i++) s += tmDay(add(ws,i)); return s; }
const hms = s => { s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); };
const hm = s => { s = Math.round(s/60); return Math.floor(s/60)+"h"+String(s%60).padStart(2,"0"); };
function timerCard(full){
  const t = today(), d = tmDay(t), w = tmWeek(), run = !!S.tm.run;
  let h = `<section class="card timer"><div class="row" style="justify-content:space-between;align-items:center"><h2>Horas líquidas</h2><span class="pill ${run?"due":""}">${run?"contando":"pausado"}</span></div>
    <div class="clock" id="tmClock">${hms(d)}</div>
    <div class="bar2" aria-hidden="true"><i id="tmBar" style="width:${Math.min(100,d/META_DIA*100).toFixed(1)}%"></i></div>
    <div class="muted" id="tmInfo">Hoje ${hm(d)} de 4h · semana ${hm(w)} de 20h</div>
    <div class="row"><button class="btn" id="tmToggle">${run?"Pausar":"Iniciar"}</button>${full?`<button class="btn small ghost" data-tmadd="900">+15 min</button><button class="btn small ghost" data-tmadd="-900">−15 min</button>`:""}</div>
    <div class="muted">Pause em qualquer interrupção: só conta tempo de estudo de verdade. A contagem continua mesmo com o app fechado.</div></section>`;
  return h;
}
function vHoras(){
  const t = today();
  let h = timerCard(true);
  const ws = weekStart(t);
  h += `<section class="card"><h2>Esta semana</h2>`;
  const dn = ["seg","ter","qua","qui","sex","sáb","dom"];
  for (let i=0;i<7;i++){ const d = add(ws,i), v = tmDay(d);
    h += `<div class="hrow${d===t?" now":""}"><span class="hd">${dn[i]} ${br(d)}</span><span class="hb"><i style="width:${Math.min(100,v/META_DIA*100).toFixed(1)}%"></i></span><span class="hv">${hm(v)}</span></div>`; }
  h += `<div class="muted">Meta do plano: 4h por dia, de segunda a sexta (20h na semana).</div></section>`;
  const days = Object.keys(S.tm.days).filter(d => d < ws && S.tm.days[d] > 0).sort().reverse().slice(0,28);
  h += `<section class="card"><h2>Semanas anteriores</h2>`;
  if (!days.length) h += `<div class="empty">Ainda não há registros anteriores.</div>`;
  const byW = {}; for (const d of days){ const k = weekStart(d); byW[k] = (byW[k]||0) + S.tm.days[d]; }
  for (const k of Object.keys(byW).sort().reverse()) h += `<div class="hrow"><span class="hd">sem. ${br(k)}</span><span class="hb"><i style="width:${Math.min(100,byW[k]/META_SEM*100).toFixed(1)}%"></i></span><span class="hv">${hm(byW[k])}</span></div>`;
  h += `</section><section class="card"><h2>Lançar horas manualmente</h2><div class="muted">Esqueceu de ligar o cronômetro? Lance aqui (use número negativo para tirar).</div>
    <div class="row"><label class="f" for="mhD" style="flex:1">Dia<input type="date" id="mhD" value="${t}"></label><label class="f" for="mhM" style="flex:1">Minutos<input type="number" id="mhM" inputmode="numeric" placeholder="ex.: 30"></label></div>
    <button class="btn small" id="mhGo" style="align-self:flex-start">Lançar</button></section>`;
  return h;
}
function tickTimer(){
  const c = document.getElementById("tmClock"); if (!c) return;
  const d = tmDay(today());
  c.textContent = hms(d);
  const b = document.getElementById("tmBar"); if (b) b.style.width = Math.min(100,d/META_DIA*100).toFixed(1)+"%";
  const i = document.getElementById("tmInfo"); if (i) i.textContent = "Hoje "+hm(d)+" de 4h · semana "+hm(tmWeek())+" de 20h";
}
setInterval(tickTimer, 1000);

/* ---------- telas ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab = "hoje", fBloco = "todos", fBusca = "";
const label = x => esc(SHORT[x[I_MAT]])+" · "+esc(x[I_AULA]);

function vHoje(){
  const t = today(), dt = new Date();
  const due = T.map(x => ({x, n: nextRev(x[I_ID])})).filter(o => o.n && o.n.d <= t).sort((a,b)=> a.n.d < b.n.d ? -1 : 1);
  let h = timerCard(false) + `<section class="card"><h2>Revisões de hoje</h2><div class="muted">Faça antes de qualquer aula nova.${due.length ? " "+due.length+" pendente"+(due.length>1?"s":"")+"." : ""}</div>`;
  if (!due.length) h += `<div class="empty">Nenhuma revisão vencida. Pode ir direto para a aula nova.</div>`;
  for (const o of due){

function curWeek(){ const t = today(); let cur = null; for (const w of WEEKS) if (w[1] <= t) cur = w; return cur; }

let GR = null, grBusy = false, grErr = "";
async function grLoad(){

  grBusy = true; grErr = "";
  try { const r = await api({acao:"grupo_info", t:c.t}); if (r.ok) GR = r; else if (r.erro === "sessao"){ setConta(null); } else grErr = r.erro || "erro"; }
  catch(e){ grErr = "Sem conexão. Tente de novo."; }

}
async function grAct(body, ok){
  const c = syncCfg(); if (!c) return;
  try { const r = await api(Object.assign({t:c.t}, body)); if (!r.ok){ toast(r.erro || "Não deu certo"); return; } if (ok) ok(r); await grLoad(); }
  catch(e){ toast("Sem conexão. Tente de novo"); }
}
function quando(ms){
  if (!ms) return "nunca sincronizou";
  const d = new Date(ms), dias = Math.floor((Date.now()-ms)/86400000), hh = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if (iso(d) === today()) return "hoje às "+hh;
  return dias <= 1 ? "ontem às "+hh : "há "+dias+" dias";
}
function resumoMembro(m){
  const t = today(), ws = weekStart(t);
  let seen = 0, late = 0, hoje = 0, pcts = []; const porMat = {}, porBl = {I:[0,0],II:[0,0],III:[0,0]};
  for (const x of T){
    const id = x[I_ID], s = m.t[id], mt = x[I_MAT];
    porMat[mt] = porMat[mt] || [0,0]; porMat[mt][1]++; porBl[x[I_BL]][1]++;
    if (!s || !s.f) continue;
    seen++; porMat[mt][0]++; porBl[x[I_BL]][0]++;
    if (typeof s.pct === "number") pcts.push(s.pct);
    const r48 = add(s.f,2), r7 = add(r48,7), r30 = add(r7,30);
    const n = !s.d48 ? r48 : !s.d7 ? r7 : !s.d30 ? r30 : null;
    if (n && n < t) late++; else if (n && n === t) hoje++;
  }
  const dia = d => (m.days[d]||0) + (m.run && d === t ? Math.max(0,(Date.now()-m.run)/1000) : 0);
  let sem = 0; for (let i=0;i<7;i++) sem += dia(add(ws,i));
  let ult7 = 0; for (let i=0;i<7;i++) ult7 += dia(add(t,-i));
  return {seen, late, hoje, pct: pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null, hojeH: dia(t), sem, ult7, porMat, porBl, run: !!m.run};
}

  if (GR.participa.length) h += `<div class="kv">${GR.participa.map(g => `<b>${esc(g.nome)}</b><span>admin: ${esc(g.admin)} · <button class="btn small ghost" data-leave="${esc(g.codigo)}">Sair</button></span>`).join("")}</div>`;
  h += `</section>`;

function bindGrupo(v){
  const re = v.querySelectorAll("#grRe"); re.forEach(b => b.onclick = () => { GR = null; grErr = ""; render(); });

  v.querySelectorAll("[data-leave]").forEach(b => b.onclick = () => grAct({acao:"grupo_sair", codigo:b.dataset.leave}, () => toast("Você saiu do grupo")));

  sh.querySelectorAll("[data-rk]").forEach(el => el.onchange = e => { s[el.dataset.rk] = e.target.checked; reopen(); });
  sh.querySelector("#dPct").oninput = e => { const v = e.target.value; s.pct = v===""?undefined:Math.max(0,Math.min(100,Number(v))); save(); };
  sh.querySelector("#dObs").oninput = e => { s.obs = e.target.value; save(); };
  sh.querySelector("#dClose").onclick = closeDlg;
}
function closeDlg(){ document.getElementById("dlg").classList.remove("open"); render(); }
document.getElementById("dlg").addEventListener("click", e => { if (e.target.id==="dlg") closeDlg(); });
window.appBack = function(){ const d = document.getElementById("dlg"); if (d.classList.contains("open")){ closeDlg(); return true; } if (tab!=="hoje"){ tab="hoje"; render(); return true; } return false; };

/* ---------- render ---------- */
function render(){
  header();
  const v = document.getElementById("view"), main = document.getElementById("main");
  const keep = main.scrollTop;
  const open = [...v.querySelectorAll("details.mat")].map(d => d.open);
  v.innerHTML = tab==="hoje" ? vHoje() : tab==="aulas" ? vAulas() : tab==="horas" ? vHoras() : tab==="crono" ? vCrono() : tab==="grupo" ? vGrupo() : vRotina();
  if (tab==="aulas"){ v.querySelectorAll("details.mat").forEach((d,i) => { if (open[i]) d.open = true; }); }
  main.scrollTop = keep;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab));
  bind();
  if (tab==="grupo") bindGrupo(v);
}
function bind(){
  const v = document.getElementById("view");
  v.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => { const n = nextRev(b.dataset.rev); if (n){ st(b.dataset.rev)[n.k] = true; save(); render(); toast("Rev "+n.n+" concluída"); } });
  v.querySelectorAll("[data-first]").forEach(b => b.onclick = () => { const s = st(b.dataset.first); s.f = today(); s.d48=s.d7=s.d30=false; save(); render(); toast("Feito. Rev 48h em "+br(add(s.f,2))); });
  v.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openAula(b.dataset.open));
  v.querySelectorAll("[data-bloco]").forEach(b => b.onclick = () => { fBloco = b.dataset.bloco; render(); });
  const tg = v.querySelector("#tmToggle"); if (tg) tg.onclick = () => { if (S.tm.run){ tmStop(); toast("Pausado: "+hm(tmDay(today()))+" hoje"); } else { tmStart(); toast("Cronômetro rodando"); } render(); };
  v.querySelectorAll("[data-tmadd]").forEach(b => b.onclick = () => { tmStop(); tmAdd(today(), Number(b.dataset.tmadd)); render(); });
  const mg = v.querySelector("#mhGo"); if (mg) mg.onclick = () => { const d = v.querySelector("#mhD").value, m = Number(v.querySelector("#mhM").value); if (!d || !m){ toast("Informe o dia e os minutos"); return; } if (d===today()) tmStop(); tmAdd(d, m*60); render(); toast("Lançado: "+(m>0?"+":"")+m+" min em "+br(d)); };
  const busca = v.querySelector("#busca");
  if (busca) busca.oninput = e => { fBusca = e.target.value; const pos = e.target.selectionStart; render(); const nb = document.getElementById("busca"); nb.focus(); try{ nb.setSelectionRange(pos,pos); }catch(_){} };
  v.querySelectorAll("[data-week]").forEach(c => c.onchange = e => { S.w[c.dataset.week] = e.target.checked; save(); });
  const sg = v.querySelector("#syncGo"); if (sg) sg.onclick = () => syncNow(false);
  const lo = v.querySelector("#lgOut"); if (lo) lo.onclick = sair;
  const lgv = () => [v.querySelector("#lgU").value.trim(), v.querySelector("#lgP").value];
  const li = v.querySelector("#lgIn"); if (li) li.onclick = () => { const [u,p] = lgv(); if (!u || !p){ toast("Preencha usuário e senha"); return; } entrar("entrar", u, p); };
  const ln = v.querySelector("#lgNew"); if (ln) ln.onclick = () => { const [u,p] = lgv(); if (!u || !p){ toast("Preencha usuário e senha"); return; } entrar("criar", u, p); };
  const lp = v.querySelector("#lgP"); if (lp) lp.onkeydown = e => { if (e.key === "Enter") li.click(); };
  const gl = v.querySelector("#goLogin"); if (gl) gl.onclick = () => { tab = "rotina"; render(); setTimeout(() => { const u = document.getElementById("lgU"); if (u){ u.scrollIntoView({block:"center"}); u.focus(); } }, 50); };
  const bc = v.querySelector("#bkCopy");
  if (bc){
    bc.onclick = async () => {
      const txt = JSON.stringify(S), ta = document.getElementById("bkText");
      try { await navigator.clipboard.writeText(txt); toast("Backup copiado"); }
      catch(e){ ta.value = txt; ta.select(); toast("Selecione o texto e copie"); }
    };
    v.querySelector("#bkRestore").onclick = () => {
      try { const o = JSON.parse(document.getElementById("bkText").value); if (!o || typeof o.t!=="object") throw 0; S = {t:o.t, w:o.w||{}, tm:o.tm||{run:null,days:{}}, sy:S.sy}; save(); render(); toast("Backup restaurado"); }
      catch(e){ toast("Backup inválido: cole o texto completo"); }
    };
    let armed = false;
    v.querySelector("#bkReset").onclick = e => {
      if (!armed){ armed = true; e.target.textContent = "Toque de novo para apagar tudo"; setTimeout(()=>{ armed=false; if (e.target.isConnected) e.target.textContent="Apagar todo o progresso"; }, 4000); return; }
      S = {t:{}, w:{}, tm:{run:null,days:{}}, sy:S.sy}; save(); render(); toast("Progresso apagado");
    };
  }
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab==="grupo" && GR){ GR = null; } document.getElementById("main").scrollTop = 0; render(); try{ history.replaceState(null,"","#"+tab); }catch(e){} });
let tt; function toast(m){ const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 2200); }
const h0 = (location.hash||"").slice(1); if (["hoje","aulas","horas","crono","rotina","grupo"].includes(h0)) tab = h0;
render();
syncNow(false);
/* ---------- atualização automática (GitHub Pages) ---------- */
const APP_V = 5, PAGES = "https://jeasanta.github.io/plano-cfo/";
async function checkUpdate(){
  if (!window.CFO || !navigator.onLine) return;
  try {
    const r = await (await fetch(PAGES + "version.json?_=" + Date.now(), {cache:"no-store"})).json();
    if (!(r && r.v > APP_V)) return;
    const html = await (await fetch(PAGES + "index.html?_=" + Date.now(), {cache:"no-store"})).text();
    if (html.indexOf("const APP_V = " + r.v) < 0) return;
    clearTimeout(syncT); await syncNow(true);
    if (window.CFO.saveApp(r.v, html)) { toast("App atualizado"); setTimeout(() => window.CFO.reload(), 800); }
  } catch(e){}
}
setTimeout(checkUpdate, 2500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
</script>
